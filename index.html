<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<meta name="description" content="Private browser-based universal media converter.">
<title>Convert.</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <a class="brand" href="#">convert<span>.</span></a>
  <button id="appearance" class="toggle" aria-label="Toggle appearance">
    <span class="sun">◐</span><span class="moon">◑</span>
  </button>
</header>
<main>
  <section class="hero">
    <h1>Convert anything.</h1>
    <p>Audio, video, and images. Everything runs in your browser — files never leave your device.</p>
  </section>

  <section class="panel">
    <label class="drop" id="drop">
      <input id="file" type="file" multiple hidden>
      <span class="drop-icon">+</span>
      <span class="drop-title" id="dropTitle">Add files</span>
      <span class="drop-hint" id="dropHint">Click or drag and drop</span>
    </label>

    <div class="row">
      <label class="select-wrap">
        <span>Convert to</span>
        <select id="format">
          <optgroup label="Audio">
            <option>MP3</option><option>M4A</option><option>AAC</option><option>WAV</option><option>FLAC</option><option>OGG</option><option>OPUS</option>
          </optgroup>
          <optgroup label="Video">
            <option>MP4</option><option>MOV</option><option>WEBM</option><option>MKV</option><option>AVI</option><option>GIF</option>
          </optgroup>
          <optgroup label="Images">
            <option>JPG</option><option>PNG</option><option>WEBP</option>
          </optgroup>
        </select>
      </label>
      <button id="convert" class="convert" disabled>Convert</button>
    </div>
  </section>

  <section class="queue" id="queue" hidden>
    <div class="queue-head">
      <span id="queueTitle">Files</span>
      <button class="link" id="clear" type="button">Clear all</button>
    </div>
    <div id="items"></div>
  </section>

  <section class="progress" id="progress" hidden>
    <div class="progress-top">
      <span id="progressLabel">Preparing…</span>
      <span id="progressValue">0%</span>
    </div>
    <div class="progress-track"><span id="progressBar"></span></div>
  </section>

  <section class="downloads" id="downloads" hidden>
    <div class="downloads-head">
      <span>Ready</span>
      <button class="link" id="downloadAll" type="button">Download all</button>
    </div>
    <div id="downloadList"></div>
  </section>
</main>
<footer>
  <span>Private by design — files stay on your device.</span>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
