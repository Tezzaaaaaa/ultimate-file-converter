name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build self-hosted offline app
        run: npm run build
      - name: Install browser test dependencies
        run: npx playwright install --with-deps chromium
      - name: Install FFmpeg test utility
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Create conversion test fixtures
        run: npm run fixtures
      # Runs before any Pages deployment step, so the branch is verified even when
      # deployment itself is limited to main by environment protection rules.
      - name: Verify offline conversions
        run: npm run test:offline
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
